<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add New Product</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="breadcrumb">Products / Add New Product</div>

  <div class="container">
    <h1>Add New Product</h1>
    <p class="subtitle">Add a new product to your store</p>

    <form id="productForm">
      <!-- Name and Description -->
      <section>
        <h2>Name and Description</h2>
        <label>Product Name</label>
        <input type="text" name="productName" required />

        <label>Product Description</label>
        <textarea name="productDescription" rows="4" required></textarea>
      </section>

      <!-- Product Details -->
      <section>
        <h2>Product Details</h2>
        <label>Brand Name</label>
        <input type="text" name="brandName" />

        <label>Product Size</label>
        <input type="text" name="productSize" />

        <label>Product Colors</label>
        <input type="text" name="productColors" />
      </section>

      <!-- Product Pricing -->
      <section>
        <h2>Product Pricing</h2>
        <label>Original Price</label>
        <input type="number" name="originalPrice" />

        <label>Discounted Price</label>
        <input type="number" name="discountedPrice" />

        <label>Discount (%)</label>
        <input type="number" name="discount" />

        <label>Minimum Order</label>
        <input type="number" name="minOrder" />
      </section>

      <!-- Category -->
      <section>
        <h2>Category</h2>
        <label>Product Category</label>
        <input type="text" name="category" />

        <label>Sub-Category</label>
        <input type="text" name="subCategory" />
      </section>

      <!-- Manage Stock -->
      <section>
        <h2>Manage Stock</h2>
        <label>SKU</label>
        <input type="text" name="sku" />

        <label>Product Stock</label>
        <input type="number" name="stock" />

        <label>Minimum Stock</label>
        <input type="number" name="minStock" />
      </section>

      <!-- Product Image -->
      <section>
        <h2>Product Image</h2>
        <label for="productImage">Upload Product Image</label>
        <input type="file" id="productImage" name="productImage" accept="image/*" />
        <div id="imagePreview" class="image-preview"></div>
      </section>

      <!-- Buttons -->
      <div class="form-actions">
        <button type="submit">Save Product</button>
        <button type="button">Schedule</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
